; Candidate build of the patched ESP32-AdBlocker (configurable plain upstream port).
; Compile-only: this project does not flash the device.
; Target: ESP32-S3 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM), custom partitions.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB

monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_HAS_PSRAM

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
